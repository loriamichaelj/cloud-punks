name: "AWS: CI roles"

# Creates the cloudbatch818-loria-* CI roles with the bootstrap Terraform stack.
# Needs the state bucket from aws-state-bucket.yml; it calls no other workflow.
# Manual only; the `bootstrap` environment's required reviewer is the gate.
on:
  workflow_dispatch:

run-name: aws-ci-roles

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-ci-roles
  cancel-in-progress: false

jobs:
  roles:
    runs-on: ubuntu-latest
    environment: bootstrap
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/terraform/bootstrap
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      # Immutable subject claims (the repo's OIDC setting): names plus numeric IDs.
      TF_VAR_oidc_subject_prefix: repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_BOOTSTRAP }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Find the state bucket
        run: |
          set -euo pipefail
          account_id=$(aws sts get-caller-identity --query Account --output text)
          bucket="loria-retail-tfstate-${account_id}-${TF_VAR_aws_region}"
          if ! aws s3api head-bucket --bucket "$bucket"; then
            echo "State bucket ${bucket} is missing or not accessible: run aws-state-bucket first" >&2
            exit 1
          fi
          echo "TF_VAR_state_bucket_name=${bucket}" >> "$GITHUB_ENV"

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_VAR_state_bucket_name}" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=${TF_VAR_aws_region}"

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        run: terraform apply tfplan

      - name: Role ARNs
        run: |
          {
            echo "### Role ARNs"
            echo '```json'
            terraform output -json role_arns
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          terraform show -no-color tfplan || true
          terraform state list || true
