# Stands in for the ALB locally. Path rules mirror the Ingress paths in DESIGN.md section 13.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  client_max_body_size 1m;

  # Docker's embedded DNS. Upstreams are resolved per request (via variables below), so a
  # service that restarts and gets a new IP does not leave the gateway pointing at a dead one.
  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # X-Correlation-ID is forwarded untouched (nginx passes request headers by default).
  proxy_connect_timeout 2s;
  proxy_send_timeout 10s;
  proxy_read_timeout 10s;

  server {
    listen 8080;

    location /api/v1/products {
      set $upstream http://product-service:8001;
      proxy_pass $upstream;
    }
    location /api/v1/categories {
      set $upstream http://product-service:8001;
      proxy_pass $upstream;
    }
    location /api/v1/inventory {
      set $upstream http://inventory-service:8002;
      proxy_pass $upstream;
    }
    location /api/v1/orders {
      set $upstream http://order-service:8003;
      proxy_pass $upstream;
    }
    # The CloudPunks market lives in order-service too (DESIGN.md section 16, ADR-19).
    location /api/v1/listings {
      set $upstream http://order-service:8003;
      proxy_pass $upstream;
    }
    location /api/v1/bids {
      set $upstream http://order-service:8003;
      proxy_pass $upstream;
    }
    location /api/v1/activity {
      set $upstream http://order-service:8003;
      proxy_pass $upstream;
    }
    location /api/v1/notifications {
      set $upstream http://notification-service:8004;
      proxy_pass $upstream;
    }

    # An unknown API path stays the gateway's JSON 404 (never the app shell).
    location /api/ {
      default_type application/json;
      return 404 '{"error":{"code":"NOT_FOUND","message":"Not Found","correlation_id":null}}';
    }

    # Everything else is the single-page app.
    location / {
      set $upstream http://ui:8005;
      proxy_pass $upstream;
    }

    # Only for failures nginx itself generates (upstream down or timed out); a 503 that a
    # service returns on purpose passes through untouched, Retry-After included.
    error_page 502 503 504 = @unavailable;
    location @unavailable {
      default_type application/json;
      add_header Retry-After 1 always;
      return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"upstream unavailable","correlation_id":null}}';
    }
  }
}
