{{- if and .Values.workload.enabled .Values.env }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "retail.name" . }}
  labels: {{- include "retail.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
