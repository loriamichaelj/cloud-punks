# Always run through the Makefile: it sets IMAGE_TAG and passes --env-file .env (without it,
# ${VAR} interpolation reads local/.env and passwords silently become empty).
name: retail

x-svc: &svc
  env_file: ../.env
  restart: unless-stopped
  environment: &env
    ENVIRONMENT: local
    LOG_LEVEL: INFO
    AWS_REGION: us-east-1
    AWS_ENDPOINT_URL: http://localstack:4566
    # LocalStack accepts any credentials; these are not real. In AWS the SDK uses Pod Identity.
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    EVENT_BUS_NAME: retail-events
    CACHE_URL: redis://valkey:6379/0
    DB_PORT: "5432"
    DB_SSLMODE: disable

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      # Read by init/01-databases.sh to create the <svc>_owner / <svc>_app roles.
      PRODUCT_OWNER_PASSWORD: ${PRODUCT_OWNER_PASSWORD:?set it in .env}
      PRODUCT_APP_PASSWORD: ${PRODUCT_APP_PASSWORD:?set it in .env}
      ORDER_OWNER_PASSWORD: ${ORDER_OWNER_PASSWORD:?set it in .env}
      ORDER_APP_PASSWORD: ${ORDER_APP_PASSWORD:?set it in .env}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      # -h 127.0.0.1: during first init the image runs a socket-only temporary server, and a
      # socket-based pg_isready would report ready before the databases and roles exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:9.0
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

  localstack:
    image: localstack/localstack:${LOCALSTACK_TAG:?set it in .env}
    restart: unless-stopped
    environment:
      SERVICES: events,sqs,dynamodb,lambda,logs,iam,sts,ses
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?set it in .env}
      LAMBDA_DOCKER_NETWORK: retail_default # Lambda containers join the Compose network
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - ../functions:/opt/functions:ro
      - ../scripts/package_lambda.py:/opt/scripts/package_lambda.py:ro # builds the Lambda zips
      - ../nft-collection:/opt/nft-collection:ro # the art the activity email draws from
      - /var/run/docker.sock:/var/run/docker.sock # required for Lambda execution
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/bootstrap.done"]
      interval: 5s
      retries: 30

  # One-shot: applies Alembic migrations as the schema owner, then exits (ADR-11). On
  # Kubernetes this becomes a pre-install,pre-upgrade Helm hook Job.
  product-migrate:
    <<: *svc
    image: retail/product-service:${IMAGE_TAG:?use make up}
    build: { context: .., dockerfile: services/product-service/Dockerfile }
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *env
      SERVICE_NAME: product-migrate
      DB_HOST: postgres
      DB_NAME: product_db
      DB_USER: product_owner
      DB_PASSWORD: ${PRODUCT_OWNER_PASSWORD:?set it in .env}
    depends_on:
      postgres: { condition: service_healthy }

  product-service:
    <<: *svc
    image: retail/product-service:${IMAGE_TAG:?use make up}
    build: { context: .., dockerfile: services/product-service/Dockerfile }
    command: ["api"]
    environment:
      <<: *env
      SERVICE_NAME: product-service
      DB_HOST: postgres
      DB_NAME: product_db
      DB_USER: product_app
      DB_PASSWORD: ${PRODUCT_APP_PASSWORD:?set it in .env}
    # Valkey is deliberately not a dependency: the cache is optional at runtime.
    depends_on:
      product-migrate: { condition: service_completed_successfully }
    ports: ["8001:8001"]

  inventory-service:
    <<: *svc
    image: retail/inventory-service:${IMAGE_TAG:?use make up}
    build: { context: .., dockerfile: services/inventory-service/Dockerfile }
    command: ["api"]
    environment:
      <<: *env
      SERVICE_NAME: inventory-service
    # Its table and queues are created by the LocalStack bootstrap; ready only checks the table.
    depends_on:
      localstack: { condition: service_healthy }
    ports: ["8002:8002"]

  # The inventory consumer: reserves stock for OrderCreated and answers with InventoryReserved or
  # InventoryFailed. Same image, own command; health and metrics on the side port 9000.
  inventory-consumer:
    <<: *svc
    image: retail/inventory-service:${IMAGE_TAG:?use make up}
    build: { context: .., dockerfile: services/inventory-service/Dockerfile }
    command: ["consumer"]
    # The consumer finishes its current 20 s long poll before it exits. Killed mid-poll, the
    # abandoned request can still be handed a message, which then stays invisible until its
    # visibility timeout (60 s) runs out: orders would stall for a minute at every restart.
    stop_grace_period: 30s
    environment:
      <<: *env
      SERVICE_NAME: inventory-consumer
      QUEUE_NAME: inventory-order-events
      EVENT_BUS_NAME: retail-events
    depends_on:
      localstack: { condition: service_healthy }

  # One-shot: applies Alembic migrations as the schema owner, then exits (ADR-11).
  order-migrate:
    <<: *svc
    image: retail/order-service:${IMAGE_TAG:?use make up}
    build: { context: .., dockerfile: services/order-service/Dockerfile }
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *env
      SERVICE_NAME: order-migrate
      DB_HOST: postgres
      DB_NAME: order_db
      DB_USER: order_owner
      DB_PASSWORD: ${ORDER_OWNER_PASSWORD:?set it in .env}
    depends_on:
      postgres: { condition: service_healthy }

  order-service:
    <<: *svc
    image: retail/order-service:${IMAGE_TAG:?use make up}
    build: { context: .., dockerfile: services/order-service/Dockerfile }
    command: ["api"]
    environment:
      <<: *env
      SERVICE_NAME: order-service
      DB_HOST: postgres
      DB_NAME: order_db
      DB_USER: order_app
      DB_PASSWORD: ${ORDER_APP_PASSWORD:?set it in .env}
      PRODUCT_SERVICE_URL: http://product-service:8001
      INVENTORY_SERVICE_URL: http://inventory-service:8002
    # Product and inventory are not start-up dependencies: the API answers 503 while they are
    # down and recovers by itself, which is the behaviour worth having in an outage.
    depends_on:
      order-migrate: { condition: service_completed_successfully }
    ports: ["8003:8003"]

  # The outbox relay: the only process that publishes order events (ADR-04). Same image, own
  # command; health and metrics on the side port 9000 (internal only).
  order-relay:
    <<: *svc
    image: retail/order-service:${IMAGE_TAG:?use make up}
    build: { context: .., dockerfile: services/order-service/Dockerfile }
    command: ["relay"]
    environment:
      <<: *env
      SERVICE_NAME: order-relay
      SWEEP_INTERVAL_S: "10" # production default is 60; shorter so drills see the gauge move
      DB_HOST: postgres
      DB_NAME: order_db
      DB_USER: order_app
      DB_PASSWORD: ${ORDER_APP_PASSWORD:?set it in .env}
    depends_on:
      order-migrate: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }

  # The order consumer: applies inventory outcomes to orders (PENDING -> CONFIRMED or REJECTED).
  # Its status events leave through the outbox, so the relay above publishes them.
  order-consumer:
    <<: *svc
    image: retail/order-service:${IMAGE_TAG:?use make up}
    build: { context: .., dockerfile: services/order-service/Dockerfile }
    command: ["consumer"]
    # The consumer finishes its current 20 s long poll before it exits. Killed mid-poll, the
    # abandoned request can still be handed a message, which then stays invisible until its
    # visibility timeout (60 s) runs out: orders would stall for a minute at every restart.
    stop_grace_period: 30s
    environment:
      <<: *env
      SERVICE_NAME: order-consumer
      DB_HOST: postgres
      DB_NAME: order_db
      DB_USER: order_app
      DB_PASSWORD: ${ORDER_APP_PASSWORD:?set it in .env}
      QUEUE_NAME: order-inventory-events
    depends_on:
      order-migrate: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }

  notification-service:
    <<: *svc
    image: retail/notification-service:${IMAGE_TAG:?use make up}
    build: { context: .., dockerfile: services/notification-service/Dockerfile }
    command: ["api"]
    environment:
      <<: *env
      SERVICE_NAME: notification-service
    # Its table is created by the LocalStack bootstrap; ready checks only the table.
    depends_on:
      localstack: { condition: service_healthy }
    ports: ["8004:8004"]

  # The notification consumer: one record per InventoryReserved, InventoryFailed and
  # OrderStatusUpdated event, deduplicated on event_id. Same image, own command.
  notification-consumer:
    <<: *svc
    image: retail/notification-service:${IMAGE_TAG:?use make up}
    build: { context: .., dockerfile: services/notification-service/Dockerfile }
    command: ["consumer"]
    # Finish the current 20 s long poll before exiting (see inventory-consumer).
    stop_grace_period: 30s
    environment:
      <<: *env
      SERVICE_NAME: notification-consumer
      QUEUE_NAME: notification-events
    depends_on:
      localstack: { condition: service_healthy }

  # The React single-page app: static files behind nginx. No runtime configuration; it calls
  # relative /api/v1 URLs, so it must be reached through the gateway. The demo tools page is a
  # build-time switch, on for local builds only.
  ui:
    image: retail/ui:${IMAGE_TAG:?use make up}
    build:
      context: ../ui
      args:
        VITE_DEMO_TOOLS: "true"
    restart: unless-stopped
    ports: ["8005:8005"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8005/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    image: nginx:1.27-alpine
    volumes: ["../gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:8080"]
    depends_on:
      product-service: { condition: service_started }
      inventory-service: { condition: service_started }
      order-service: { condition: service_started }
      notification-service: { condition: service_started }
      ui: { condition: service_healthy }
    restart: unless-stopped

  # One-shot dev job (`make seed`): catalog into product_db, stock into DynamoDB.
  seed:
    <<: *svc
    profiles: [tools]
    image: retail/product-service:${IMAGE_TAG:?use make up}
    build: { context: .., dockerfile: services/product-service/Dockerfile }
    command: ["seed"]
    restart: "no"
    environment:
      <<: *env
      SERVICE_NAME: seed
      DB_HOST: postgres
      DB_NAME: product_db
      DB_USER: product_app
      DB_PASSWORD: ${PRODUCT_APP_PASSWORD:?set it in .env}
    depends_on:
      product-migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }

  # Metrics and the one dashboard (`make obs-up`, then http://localhost:3000). Off by default:
  # they cost memory the 8 GB Mac would rather spend on the platform. Local only, so Grafana
  # allows anonymous read access and both ports are bound to loopback.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../deploy/helm/monitoring/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg-data: {}
