name: "App: test"

# Every check pr.yml runs on a pull request, run by hand on any branch. It builds nothing that is
# published and needs no AWS access, no secret and no approval.
#
#   code         `make lint test`: ruff, mypy per service, the OpenAPI and UI checks, Helm lint and
#                kubeconform over every values file, and every unit test with the coverage gates.
#   images       builds each of the five arm64 images (the architecture app-build.yml ships) and scans
#                it with Trivy: fixable HIGH and CRITICAL fail.
#   terraform    fmt, validate, tflint and Checkov over infra/terraform. No `terraform plan`.
#   config-scan  Trivy over Dockerfiles, Helm and Terraform for misconfigurations.
#   workflows    actionlint over .github/workflows.
#   notify       always runs; writes the result to the run summary and comments on the commit.
#
# pr.yml decides from the changed files which of these a pull request needs; this runs all of them.
# Keep the two in step: a pin changed in one is changed in the other. The cloud acceptance suite is in
# app-deploy.yml; integration tests, the drills and the browser journeys stay local because they need
# LocalStack. This workflow calls no other.
on:
  workflow_dispatch:

run-name: app-test ${{ github.ref_name }}

permissions:
  contents: read

# Its own group: it uses no AWS and must not hold up a deploy.
concurrency:
  group: app-test-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: v0.75.0

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Same uv version as the Dockerfiles.
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.15

      # k8s-lint validates the rendered manifests with kubeconform when it is installed.
      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSLo kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Lint and unit tests
        env:
          UV_PYTHON_DOWNLOADS: never
        run: make lint test

  images:
    name: images (${{ matrix.name }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: product, dockerfile: services/product-service/Dockerfile, context: . }
          - { name: inventory, dockerfile: services/inventory-service/Dockerfile, context: . }
          - { name: order, dockerfile: services/order-service/Dockerfile, context: . }
          - { name: notification, dockerfile: services/notification-service/Dockerfile, context: . }
          - { name: ui, dockerfile: ui/Dockerfile, context: ui }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Built for arm64, the architecture app-build.yml ships, and kept local: it is scanned, never pushed.
      - name: Build the image
        env:
          NAME: ${{ matrix.name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
        run: docker buildx build --load -f "$DOCKERFILE" -t "scan/${NAME}:pr" "$CONTEXT"

      # Fixable HIGH and CRITICAL fail the job. Findings with no fix yet are not held against the change.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: scan/${{ matrix.name }}:pr
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore.yaml

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Format and validate
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra/terraform
          for dir in bootstrap envs/dev/platform envs/dev/cluster-addons; do
            echo "== validate ${dir}"
            terraform -chdir="infra/terraform/${dir}" init -backend=false -input=false >/dev/null
            terraform -chdir="infra/terraform/${dir}" validate
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      # Warnings and errors fail; notices (for example the unmodified default parameter group) do not.
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # only to download the AWS ruleset without hitting rate limits
        run: |
          set -euo pipefail
          tflint --init --config="${GITHUB_WORKSPACE}/.tflint.hcl"
          cd infra/terraform
          tflint --config="${GITHUB_WORKSPACE}/.tflint.hcl" --recursive --minimum-failure-severity=warning --format compact

      # Every exception is an inline `#checkov:skip=ID:reason` next to its resource, so a new failing
      # check is a failure here and an accepted one explains itself where it lives.
      - name: Checkov
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}/infra/terraform:/tf:ro" \
            bridgecrew/checkov@sha256:617c76e3f9b1f7907ebca9abb6b9d746844edcb48e9bd775e4692c69c1c6ac47 \
            -d /tf --framework terraform --compact --quiet

  config-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Dockerfiles, Helm and Terraform
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          trivyignores: .trivyignore.yaml
          skip-dirs: .venv,ui/node_modules

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .github/actionlint.yaml declares the retail-vpc runner label.
      - name: actionlint
        run: |
          set -euo pipefail
          curl -fsSLo actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint

  notify:
    needs: [code, images, terraform, config-scan, workflows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Report the result
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          overall="succeeded"
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' >/dev/null; then
            overall="failed"
          fi
          table=$(echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"')
          body="$(printf '%s\n' \
            "**app-test ${overall}** for \`${REF_NAME}\` at \`${GITHUB_SHA}\`" \
            "" \
            "| Job | Result |" \
            "| --- | --- |" \
            "${table}" \
            "" \
            "${RUN_URL}")"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$body" >/dev/null
