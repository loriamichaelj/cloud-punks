{{- if and .Values.workload.enabled .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "retail.name" . }}
  labels: {{- include "retail.labels" . | nindent 4 }}
spec:
  selector: {{- include "retail.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
