# HTTPS on the viewer ALB, laid over values-ingress-public-dev.yaml when the dev environment
# variable DEV_DOMAIN is set. The workflow adds `ingress.tlsHosts` (dev.<domain>), and the AWS Load
# Balancer Controller attaches the ACM certificate the dns stack issued for that name.
#
# Port 80 redirects to 443. Who may connect is still only inbound-cidrs (DEV_VIEWER_CIDR): HTTPS
# protects the traffic, and the allow-list is still what keeps the API's admin endpoints private.
workload:
  enabled: false
ingress:
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
