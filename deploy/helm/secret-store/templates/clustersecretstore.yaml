apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: secret-store
    app.kubernetes.io/part-of: retail-platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" .Values.region | quote }}
      # No auth block: the operator's pods get credentials from EKS Pod Identity
      # (the external-secrets service account's role), through the default chain.
