name: bootstrap

# Calls state-bucket.yml, then creates the cloudbatch818-* roles.
# Manual only; the `bootstrap` environment's required reviewer is the gate.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  state-bucket:
    uses: ./.github/workflows/state-bucket.yml

  roles:
    needs: state-bucket
    runs-on: ubuntu-latest
    environment: bootstrap
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/terraform/bootstrap
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      # Immutable subject claims (the repo's OIDC setting): names plus numeric IDs.
      TF_VAR_oidc_subject_prefix: repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}
      TF_VAR_state_bucket_name: ${{ needs.state-bucket.outputs.bucket }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_BOOTSTRAP }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_VAR_state_bucket_name}" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=${TF_VAR_aws_region}"

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        run: terraform apply tfplan

      - name: Role ARNs
        run: |
          {
            echo "### Role ARNs"
            echo '```json'
            terraform output -json role_arns
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          terraform show -no-color tfplan || true
          terraform state list || true
