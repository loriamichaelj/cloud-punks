apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  labels: {{- include "monitoring.labels" (dict "root" . "name" "grafana") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: {{- include "monitoring.labels" (dict "root" . "name" "grafana") | nindent 4 }}
spec:
  selector: {{- include "monitoring.selector" (dict "root" . "name" "grafana") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {{- include "monitoring.labels" (dict "root" . "name" "grafana") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "monitoring.selector" (dict "root" . "name" "grafana") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "monitoring.labels" (dict "root" . "name" "grafana") | nindent 8 }}
      annotations:
        checksum/provisioning: {{ cat (include (print $.Template.BasePath "/grafana-config.yaml") .) | sha256sum }}
    spec:
      serviceAccountName: grafana
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          ports:
            - name: http
              containerPort: 3000
          env:
            # View only. There is no login, no sign-up and no admin user at all, so the one address the
            # viewer ALB admits can look at the dashboards and change nothing. Dashboards come from files.
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
            - { name: GF_AUTH_BASIC_ENABLED, value: "false" }
            - { name: GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION, value: "true" }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            # Reached at /grafana on the viewer ALB.
            - { name: GF_SERVER_ROOT_URL, value: "%(protocol)s://%(domain)s{{ .Values.grafana.subPath }}/" }
            - { name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true" }
            # Logs go to stdout (Container Insights ships them); nothing goes out to the internet.
            - { name: GF_LOG_MODE, value: console }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false" }
            - { name: GF_NEWS_NEWS_FEED_ENABLED, value: "false" }
            - { name: GF_PLUGINS_PLUGIN_ADMIN_ENABLED, value: "false" }
            # Grafana 13 downloads a set of default apps from grafana.com at startup and tries to update the
            # bundled plugins. Off: it is an outside request, it slows the start, and the filesystem is read-only.
            - { name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true" }
            - { name: GF_SECURITY_DISABLE_GRAVATAR, value: "true" }
          # Up to 5 minutes to start before the liveness probe may kill it: a small node starts it slowly.
          startupProbe:
            httpGet: { path: {{ .Values.grafana.subPath }}/api/health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: {{ .Values.grafana.subPath }}/api/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: {{ .Values.grafana.subPath }}/api/health, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources: {{- toYaml .Values.grafana.resources | nindent 12 }}
          securityContext: {{- include "monitoring.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: tmp, mountPath: /tmp }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml, readOnly: true }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml, readOnly: true }
            - { name: dashboards, mountPath: /etc/grafana/dashboards, readOnly: true }
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: provisioning
          configMap: { name: grafana-provisioning }
        - name: dashboards
          configMap: { name: grafana-dashboards }
