# The Kubernetes Secrets the pods and the migration Jobs read, created by External Secrets from
# AWS Secrets Manager. Its own release, installed first, because a migration hook runs before
# the release's own resources exist. Each Secrets Manager secret is JSON with a "password" key.
workload:
  enabled: false
externalSecret:
  enabled: true
  secrets:
    - name: product-app-db
      data: [{ secretKey: DB_PASSWORD, remoteKey: loria-retail-dev/product-app-db, property: password }]
    - name: product-owner-db
      data: [{ secretKey: DB_PASSWORD, remoteKey: loria-retail-dev/product-owner-db, property: password }]
    - name: order-app-db
      data: [{ secretKey: DB_PASSWORD, remoteKey: loria-retail-dev/order-app-db, property: password }]
    - name: order-owner-db
      data: [{ secretKey: DB_PASSWORD, remoteKey: loria-retail-dev/order-owner-db, property: password }]
