name: bootstrap

# Creates the Terraform state bucket, then the cloudbatch818-* roles.
# Manual only; the `bootstrap` environment's required reviewer is the gate.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  state-bucket:
    runs-on: ubuntu-latest
    environment: bootstrap
    timeout-minutes: 10
    outputs:
      bucket: ${{ steps.bucket.outputs.name }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_BOOTSTRAP }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create or update the state bucket
        id: bucket
        env:
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          account_id=$(aws sts get-caller-identity --query Account --output text)
          bucket="retail-tfstate-${account_id}-${REGION}"
          echo "name=${bucket}" >> "$GITHUB_OUTPUT"

          if aws s3api head-bucket --bucket "$bucket" 2> head.err; then
            echo "Bucket ${bucket} exists"
          elif grep -q -E "404|Not Found" head.err; then
            echo "Creating ${bucket}"
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$bucket"
            else
              aws s3api create-bucket --bucket "$bucket" \
                --create-bucket-configuration "LocationConstraint=${REGION}"
            fi
          else
            cat head.err
            echo "Cannot use ${bucket}: not a 404, so it exists elsewhere or access is denied" >&2
            exit 1
          fi

          aws s3api put-bucket-versioning --bucket "$bucket" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption --bucket "$bucket" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'

          aws s3api put-public-access-block --bucket "$bucket" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          cat > policy.json <<POLICY
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "DenyInsecureTransport",
                "Effect": "Deny",
                "Principal": "*",
                "Action": "s3:*",
                "Resource": ["arn:aws:s3:::${bucket}", "arn:aws:s3:::${bucket}/*"],
                "Condition": {"Bool": {"aws:SecureTransport": "false"}}
              }
            ]
          }
          POLICY
          aws s3api put-bucket-policy --bucket "$bucket" --policy file://policy.json

          aws s3api put-bucket-lifecycle-configuration --bucket "$bucket" \
            --lifecycle-configuration \
            '{"Rules":[{"ID":"expire-noncurrent-versions","Status":"Enabled","Filter":{},"NoncurrentVersionExpiration":{"NoncurrentDays":90},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":7}}]}'

      - name: Show bucket configuration
        env:
          BUCKET: ${{ steps.bucket.outputs.name }}
        run: |
          set -euo pipefail
          aws s3api get-bucket-versioning --bucket "$BUCKET"
          aws s3api get-bucket-encryption --bucket "$BUCKET"
          aws s3api get-public-access-block --bucket "$BUCKET"
          aws s3api get-bucket-lifecycle-configuration --bucket "$BUCKET"

  roles:
    needs: state-bucket
    runs-on: ubuntu-latest
    environment: bootstrap
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/terraform/bootstrap
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_state_bucket_name: ${{ needs.state-bucket.outputs.bucket }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_BOOTSTRAP }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_VAR_state_bucket_name}" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=${TF_VAR_aws_region}"

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        run: terraform apply tfplan

      - name: Role ARNs
        run: |
          {
            echo "### Role ARNs"
            echo '```json'
            terraform output -json role_arns
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          terraform show -no-color tfplan || true
          terraform state list || true
