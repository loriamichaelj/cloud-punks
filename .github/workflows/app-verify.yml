name: "App: verify"

# Read-only. Answers three questions about the images, and changes nothing:
#   1. What is in ECR?             every tag and digest in the five loria-retail/* repositories.
#   2. Does the cluster run it?    for every pod in `retail`, the image digest the node actually pulled
#                                  against the digest ECR holds for that tag. A difference fails the run.
#   3. Is the tag current?         the commit in a running tag (sha-<commit>) against this checkout: which
#                                  files an image is built from have changed since. Reported as a warning,
#                                  not a failure, because running an older tag can be deliberate.
#
# Runs on the in-VPC runner as cloudbatch818-loria-retail-deploy-dev (ECR describe, and read of pods in
# `retail`); one job, one approval from the `dev` environment's reviewer.
on:
  workflow_dispatch:

run-name: app-verify

permissions:
  contents: read
  id-token: write

# Shares the group with the other app workflows so a verify never overlaps a deploy.
concurrency:
  group: app-dev
  cancel-in-progress: false

env:
  EKS_CLUSTER: loria-retail-dev
  NAMESPACE: retail
  REPOS: product inventory order notification ui
  # What an image is built from. A change in any of these makes an older tag stale.
  IMAGE_INPUTS: services libs ui pyproject.toml uv.lock local/seed functions

jobs:
  verify:
    runs-on: [self-hosted, retail-vpc]
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the commit in a tag may be any ancestor of HEAD

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEPLOY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Compare ECR, the cluster and the code
        run: |
          set -euo pipefail
          # Always name the context explicitly.
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --alias "$EKS_CLUSTER" --region "$AWS_REGION"
          report="${RUNNER_TEMP}/verify.md"
          pods="${RUNNER_TEMP}/pods.tsv"
          problems=0

          {
            echo "### 1. What is in ECR"
            echo
            echo "| Repository | Tags | Digest | Pushed |"
            echo "| --- | --- | --- | --- |"
          } > "$report"
          for r in $REPOS; do
            aws ecr describe-images --repository-name "loria-retail/${r}" --output json \
              | jq -r --arg r "loria-retail/${r}" '
                  .imageDetails | sort_by(.imagePushedAt)[]
                  | "| `\($r)` | \((.imageTags // ["(untagged)"]) | join(", ")) | `\(.imageDigest[0:19])` | \(.imagePushedAt) |"' \
              >> "$report"
          done

          # One row per container: pod, image as configured, image as pulled (a digest).
          kubectl --context "$EKS_CLUSTER" --namespace "$NAMESPACE" get pods -o json \
            | jq -r '.items[] | .metadata.name as $p | (.status.containerStatuses // [])[]
                     | [$p, .image, .imageID] | @tsv' > "$pods"
          if [ ! -s "$pods" ]; then
            echo "no pods with containers found in ${NAMESPACE}" >&2
            exit 1
          fi

          {
            echo
            echo "### 2. What the cluster runs, against ECR"
            echo
            echo "| Pod | Image | Running digest | ECR digest for that tag | |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$report"
          while IFS=$'\t' read -r pod image image_id; do
            ref="${image#*/}"            # loria-retail/order:sha-<commit>
            repo="${ref%%:*}"
            tag="${ref##*:}"
            running="${image_id##*@}"    # sha256:...
            ecr=$(aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=${tag}" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "MISSING")
            if [ "$ecr" = "$running" ]; then verdict="match"; else verdict="**MISMATCH**"; problems=$((problems + 1)); fi
            echo "| \`${pod}\` | \`${repo}:${tag:0:11}…\` | \`${running:0:19}\` | \`${ecr:0:19}\` | ${verdict} |" >> "$report"
          done < "$pods"

          {
            echo
            echo "### 3. Is the running tag current?"
            echo
            echo "| Tag | Files the images are built from that changed since | |"
            echo "| --- | --- | --- |"
          } >> "$report"
          tags="${RUNNER_TEMP}/tags.txt"
          cut -f2 "$pods" | sed 's/.*://' | sort -u > "$tags"
          while read -r tag; do
            commit="${tag#sha-}"
            if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
              echo "| \`${tag:0:11}…\` | the commit is not in this checkout's history | unknown |" >> "$report"
              echo "::warning::${tag} names a commit that is not in this checkout"
              continue
            fi
            # shellcheck disable=SC2086
            changed=$(git diff --name-only "$commit" HEAD -- $IMAGE_INPUTS ':(exclude)**/tests/**' | tr '\n' ' ')
            if [ -z "$changed" ]; then
              echo "| \`${tag:0:11}…\` | none | current |" >> "$report"
            else
              echo "| \`${tag:0:11}…\` | ${changed} | **stale** |" >> "$report"
              echo "::warning::the images tagged ${tag} are older than the code: ${changed}"
            fi
          done < "$tags"

          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          cat "$report"
          if [ "$problems" -gt 0 ]; then
            echo "${problems} container(s) run a digest that ECR does not hold for their tag" >&2
            exit 1
          fi
