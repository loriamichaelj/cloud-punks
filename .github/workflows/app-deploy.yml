name: "App: deploy"

# deploy -> notify, for the dev environment.
#
#   deploy  helm upgrade --install of every release on the dev cluster from the
#           in-VPC runners, then the e2e acceptance test. Needs the `dev`
#           approval. Deploys images that app-prepare.yml already pushed; it
#           builds nothing.
#   notify  always runs; writes the result to the run summary and comments on
#           the commit.
#
# Needs the retail-vpc runner, the cluster add-ons and the data stores, the dev Helm
# values, the workload roles, and the database and app-user secrets in Secrets Manager.
# This workflow calls no other.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy, sha-<40 hex chars>. Empty: sha-<this commit>"
        type: string
        required: false
        default: ""

run-name: app-deploy ${{ inputs.tag }}

permissions:
  contents: read
  id-token: write

# Shares the group with app-prepare and app-destroy so they never overlap.
concurrency:
  group: app-dev
  cancel-in-progress: false

env:
  EKS_CLUSTER: loria-retail-dev
  NAMESPACE: retail
  HELM_CHART: deploy/helm/retail-service
  HELM_VALUES: deploy/helm/values

jobs:
  deploy:
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    # The cluster API is private, so this runs on the in-VPC runners.
    runs-on: [self-hosted, retail-vpc]
    environment: dev
    timeout-minutes: 60
    env:
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the image tag
        id: tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/dev" ]; then
            echo "app-deploy runs from the dev branch only, not ${GITHUB_REF}" >&2
            exit 1
          fi
          tag="${INPUT_TAG:-sha-${GITHUB_SHA}}"
          if ! [[ "$tag" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "the tag must look like sha-<40 hex chars>, got: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "### app-deploy: \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEPLOY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check the images exist
        run: |
          set -euo pipefail
          for r in product inventory order notification ui; do
            if ! aws ecr describe-images --repository-name "loria-retail/${r}" \
                --image-ids "imageTag=${TAG}" >/dev/null 2>&1; then
              echo "loria-retail/${r}:${TAG} is not in ECR: run app-prepare first" >&2
              exit 1
            fi
          done

      - name: Check the dev values exist
        run: |
          set -euo pipefail
          releases="secrets product-service inventory-service order-service inventory-consumer order-relay order-consumer notification-service notification-consumer ui ingress"
          missing=0
          [ -f "${HELM_VALUES}/values-common-dev.yaml" ] || { echo "missing ${HELM_VALUES}/values-common-dev.yaml" >&2; missing=1; }
          for r in $releases; do
            [ -f "${HELM_VALUES}/values-${r}-dev.yaml" ] || { echo "missing ${HELM_VALUES}/values-${r}-dev.yaml" >&2; missing=1; }
          done
          exit "$missing"

      - name: Deploy the releases
        run: |
          set -euo pipefail
          # Always name the context explicitly.
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --alias "$EKS_CLUSTER" --region "$AWS_REGION"
          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          helm_cmd=(helm --kube-context "$EKS_CLUSTER" --namespace "$NAMESPACE")
          kube=(kubectl --context "$EKS_CLUSTER" --namespace "$NAMESPACE")

          # The database passwords come first: External Secrets copies them from Secrets
          # Manager, and a migration Job runs before its own release creates anything.
          echo "== secrets"
          "${helm_cmd[@]}" upgrade --install --wait --timeout 5m \
            secrets "$HELM_CHART" -f "${HELM_VALUES}/values-secrets-dev.yaml"
          for s in product-app-db product-owner-db order-app-db order-owner-db; do
            for _ in $(seq 1 36); do
              "${kube[@]}" get secret "$s" >/dev/null 2>&1 && break
              sleep 5
            done
            "${kube[@]}" get secret "$s" >/dev/null 2>&1 || {
              echo "External Secrets did not create ${s}: does loria-retail-dev/${s} exist in Secrets Manager with a \"password\" key?" >&2
              exit 1
            }
          done

          # release:image repository. Release order: a first install waits for its migration Job.
          for pair in \
            product-service:product inventory-service:inventory order-service:order \
            inventory-consumer:inventory order-relay:order order-consumer:order \
            notification-service:notification notification-consumer:notification; do
            release="${pair%%:*}"
            image="${pair##*:}"
            echo "== ${release}"
            "${helm_cmd[@]}" upgrade --install --rollback-on-failure --wait --timeout 10m \
              "$release" "$HELM_CHART" \
              -f "${HELM_VALUES}/values-common-dev.yaml" -f "${HELM_VALUES}/values-${release}-dev.yaml" \
              --set "image.repository=${registry}/loria-retail/${image}" --set "image.tag=${TAG}"
          done

          echo "== ui"
          "${helm_cmd[@]}" upgrade --install --rollback-on-failure --wait --timeout 10m \
            ui "$HELM_CHART" -f "${HELM_VALUES}/values-ui-dev.yaml" \
            --set "image.repository=${registry}/loria-retail/ui" --set "image.tag=${TAG}"

          echo "== gateway (the shared Ingress)"
          "${helm_cmd[@]}" upgrade --install --rollback-on-failure --wait --timeout 5m \
            gateway "$HELM_CHART" -f "${HELM_VALUES}/values-ingress-dev.yaml"

          # Prometheus and Grafana. Last, so a problem here never blocks the application. The Role
          # Prometheus needs comes from the cluster-addons stack (addons-create.yml), not from this chart.
          # Alertmanager publishes to the topic the CloudWatch alarms use; its ARN is built here so the
          # account id stays out of the repository.
          echo "== monitoring (Prometheus, Alertmanager and Grafana)"
          "${helm_cmd[@]}" upgrade --install --rollback-on-failure --wait --timeout 6m \
            monitoring deploy/helm/monitoring \
            --set "alertmanager.snsTopicArn=arn:aws:sns:${AWS_REGION}:${account_id}:loria-retail-dev-alarms" \
            --set "alertmanager.region=${AWS_REGION}"

          "${kube[@]}" get pods

      # The internal ALB takes a few minutes to get an address and healthy targets.
      - name: Find the ALB and wait for it to answer
        run: |
          set -euo pipefail
          host=""
          for _ in $(seq 1 60); do
            host=$(kubectl --context "$EKS_CLUSTER" --namespace "$NAMESPACE" get ingress gateway \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            [ -n "$host" ] && break
            sleep 10
          done
          if [ -z "$host" ]; then
            echo "the Ingress has no ALB address after 10 minutes" >&2
            kubectl --context "$EKS_CLUSTER" --namespace "$NAMESPACE" describe ingress gateway || true
            exit 1
          fi
          code=""
          for _ in $(seq 1 60); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://${host}/" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          if [ "$code" != "200" ]; then
            echo "http://${host}/ answered ${code:-nothing} after 10 minutes" >&2
            exit 1
          fi
          echo "E2E_GATEWAY_URL=http://${host}" >> "$GITHUB_ENV"
          echo "- Dev ALB: \`http://${host}\` (internal, reachable only inside the VPC)" >> "$GITHUB_STEP_SUMMARY"
          # The browser address is the public ALB that app-expose installs, if it is installed.
          public=$(kubectl --context "$EKS_CLUSTER" --namespace "$NAMESPACE" get ingress gateway-public \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          if [ -n "$public" ]; then
            echo "- Public storefront: \`http://${public}\` (open from the DEV_VIEWER_CIDR address)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Public storefront: not installed (run App: expose to open it in a browser)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl --context "$EKS_CLUSTER" --namespace "$NAMESPACE" get pods,events || true
          helm --kube-context "$EKS_CLUSTER" --namespace "$NAMESPACE" list || true

      # The acceptance suite in cloud mode. Orders go through the ALB (E2E_GATEWAY_URL, set
      # above). The few things the ALB does not expose are reached the way `make k8s-e2e` does it
      # locally: the four APIs are port-forwarded to localhost, and scripts/k8s_compose.py answers
      # the suite's "compose" commands with kubectl (scale a consumer to 0 and back, read logs,
      # scrape /metrics). E2E_CLOUD=1 skips the dead letter queue count (the deploy role may not
      # read the queues) and points the low-stock Lambda test at the real CloudWatch log group
      # (E2E_LAMBDA_LOG_GROUP, which the deploy role may read). One more cloud-only test traces an
      # order across the services in CloudWatch with Logs Insights, on the Container Insights
      # application log group (E2E_APP_LOG_GROUP; the deploy role may query that one group). Two
      # more check the monitoring release: Prometheus scrapes every process and has its alert rules
      # wired to Alertmanager, and Grafana is up with its dashboard. The drills and the UI journeys are not run.
      # Steps 2 to 10 write test stock for two SKUs and place orders for e2e-* customers in dev.
      - name: E2E acceptance
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          uv sync --all-packages --locked
          kube=(kubectl --context "$EKS_CLUSTER" --namespace "$NAMESPACE")

          pids=""
          trap 'kill $pids 2>/dev/null || true' EXIT
          for pair in product-service:8001 inventory-service:8002 order-service:8003 notification-service:8004 prometheus:9090 alertmanager:9093 grafana:3000; do
            "${kube[@]}" port-forward "svc/${pair%%:*}" "${pair##*:}:${pair##*:}" >/dev/null 2>&1 &
            pids="$pids $!"
          done
          sleep 5

          E2E_K8S=1 E2E_CLOUD=1 \
          E2E_LAMBDA_LOG_GROUP=/aws/lambda/loria-low-stock-alert \
          E2E_APP_LOG_GROUP=/aws/containerinsights/loria-retail-dev/application \
          E2E_PROMETHEUS_URL=http://localhost:9090 \
          E2E_ALERTMANAGER_URL=http://localhost:9093 \
          E2E_GRAFANA_URL=http://localhost:3000 \
          K8S_CONTEXT="$EKS_CLUSTER" K8S_NAMESPACE="$NAMESPACE" \
          E2E_COMPOSE="$PWD/.venv/bin/python $PWD/scripts/k8s_compose.py" \
          PYTHONPATH=tests/e2e \
            uv run --frozen --no-sync pytest tests/e2e/test_acceptance.py -q

      # What a failed low-stock test needs to be diagnosed from the run alone: the two places the event
      # passes through. The inventory consumer publishes it; the Lambda logs it. Read-only, best effort.
      - name: Show the low-stock path on failure
        if: failure()
        run: |
          set +e
          since_ms=$(( ($(date +%s) - 1800) * 1000 ))
          echo "== low-stock Lambda log, last 30 minutes (newest last)"
          aws logs filter-log-events --log-group-name /aws/lambda/loria-low-stock-alert \
            --start-time "$since_ms" --query 'events[].message' --output text | tail -n 40
          echo "== inventory-consumer log, last 30 minutes"
          kubectl --context "$EKS_CLUSTER" --namespace "$NAMESPACE" logs deploy/inventory-consumer \
            --since=30m --tail=80
          echo "== pods"
          kubectl --context "$EKS_CLUSTER" --namespace "$NAMESPACE" get pods

  notify:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Report the result
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.deploy.outputs.tag }}
          R_DEPLOY: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          overall="succeeded"
          case "$R_DEPLOY" in
            failure|cancelled) overall="failed" ;;
          esac
          body="$(printf '%s\n' \
            "**app-deploy ${overall}** for \`${TAG:-unknown}\`" \
            "" \
            "| Job | Result |" \
            "| --- | --- |" \
            "| deploy | ${R_DEPLOY} |" \
            "" \
            "${RUN_URL}")"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$body" >/dev/null
