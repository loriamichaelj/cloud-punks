name: infra

# dev/platform stack (network, ecr, eks).
# - pull_request: plan only, as cloudbatch818-tf-plan, posted as a PR comment.
# - workflow_dispatch: plan, then apply, as cloudbatch818-tf-apply-dev.
#   The `dev` environment's required reviewer approves the run before any
#   AWS call. Apply is manual on purpose: it creates a cluster that costs money.
on:
  pull_request:
    paths:
      - "infra/terraform/envs/dev/platform/**"
      - "infra/terraform/modules/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  STATE_KEY: dev/platform/terraform.tfstate

defaults:
  run:
    working-directory: infra/terraform/envs/dev/platform

jobs:
  plan:
    # Fork PRs get no OIDC token and no role. Skip them rather than fail.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_TF_PLAN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          terraform init \
            -backend-config="bucket=retail-tfstate-${account_id}-${TF_VAR_aws_region}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${TF_VAR_aws_region}"

      - name: Plan
        run: terraform plan -lock-timeout=5m -no-color -out=tfplan

      - name: Post the plan
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            echo "### terraform plan: dev/platform"
            echo
            echo '```'
            terraform show -no-color tfplan 2>&1 | head -c 60000 || echo "no plan was produced"
            echo '```'
          } > comment.md
          gh pr comment "$PR_URL" --body-file comment.md --edit-last --create-if-none

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 90
    concurrency:
      group: infra-dev-platform
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_TF_APPLY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          terraform init \
            -backend-config="bucket=retail-tfstate-${account_id}-${TF_VAR_aws_region}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${TF_VAR_aws_region}"

      - name: Plan
        run: terraform plan -lock-timeout=5m -no-color -out=tfplan

      - name: Plan summary
        if: always()
        run: |
          {
            echo "### terraform plan: dev/platform"
            echo '```'
            terraform show -no-color tfplan 2>&1 | head -c 100000 || echo "no plan was produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        run: terraform apply -lock-timeout=5m -no-color tfplan

      - name: Outputs
        run: |
          {
            echo "### Outputs"
            echo '```json'
            terraform output -json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          terraform show -no-color tfplan || true
          terraform state list || true
