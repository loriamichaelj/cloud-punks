[project]
name = "retail-common"
version = "0.1.0"
description = "Shared config, logging, metrics, health, errors and event plumbing for all services."
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "fastapi",
    "httpx2",
    "prometheus-client",
    "psycopg[binary]",
    "pydantic-settings",
    "python-ulid",
    "sqlalchemy",
    "structlog",
    "tenacity",
    "uvicorn",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "retail_common"
