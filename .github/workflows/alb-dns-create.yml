name: "ALB DNS: create"

# dev/alb-dns stack: the alias records dev.<domain> (the viewer ALB) and internal.dev.<domain> (the internal
# ALB), created from workflow_dispatch only.
# Run it after dns-create.yml and after app-deploy.yml (and app-expose.yml, for the viewer name): the ALBs do
# not exist before that, because the AWS Load Balancer Controller creates them from the Ingresses. An ALB that
# is not installed gets no record. Run it again after either ALB is recreated (app-expose remove then expose
# gives the viewer ALB a new DNS name).
# Jobs run as cloudbatch818-loria-retail-tf-dev, each approved by the
# `dev` environment's required reviewer. Pick an action:
#   plan   the `plan` job only: print the plan, change nothing.
#   apply  `plan`, then `apply` after a second approval, applying exactly the
#          saved plan.
# Tearing the stack down is alb-dns-destroy.yml; run it before dns-destroy.yml and platform-destroy.yml,
# which refuse while the stacks still have resources.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the dev/alb-dns stack
        type: choice
        options:
          - plan
          - apply
        default: plan

run-name: alb-dns-create ${{ inputs.action }}

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  STATE_KEY: dev/alb-dns/terraform.tfstate

defaults:
  run:
    working-directory: infra/terraform/envs/dev/alb-dns

# Shares the platform workflows' group so none of them runs at once.
concurrency:
  group: platform-dev
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_key: ${{ steps.save.outputs.plan_key }}
      plan_sha256: ${{ steps.save.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_TF }}
          aws-region: ${{ vars.AWS_REGION }}

      # The domain comes from the `dev` environment variable DEV_DOMAIN. scripts/dev_domain.py checks it
      # (it ends up in DNS names), and an empty value stops here: this stack has nothing to do without one.
      - name: Check the domain
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
        run: |
          set -euo pipefail
          domain=$(DEV_DOMAIN="${DEV_DOMAIN}" python3 "${GITHUB_WORKSPACE}/scripts/dev_domain.py" domain)
          if [ -z "$domain" ]; then
            echo "the dev environment variable DEV_DOMAIN is not set: register the domain first (docs/runbooks/https-and-domain.md)" >&2
            exit 1
          fi
          echo "TF_VAR_domain_name=${domain}" >> "$GITHUB_ENV"

      # The AWS Load Balancer Controller creates both ALBs from their Ingresses and AWS invents their DNS
      # names, so look the current ones up and pass them in. An ALB that is not installed (the viewer ALB
      # exists only after app-expose) gets no record. Run again after either ALB is recreated.
      - name: Find the ALBs
        run: |
          set -euo pipefail
          found=0
          for pair in INTERNAL:loria-retail-dev PUBLIC:loria-retail-dev-public; do
            prefix="${pair%%:*}"
            name="${pair##*:}"
            info=$(aws elbv2 describe-load-balancers --names "$name" \
              --query 'LoadBalancers[0].[DNSName,CanonicalHostedZoneId]' --output text 2>/dev/null || true)
            if [ -z "$info" ] || [ "$info" = "None" ]; then
              echo "no load balancer named ${name}: no record for it"
              continue
            fi
            found=1
            echo "TF_VAR_${prefix,,}_alb_dns_name=$(echo "$info" | cut -f1)" >> "$GITHUB_ENV"
            echo "TF_VAR_${prefix,,}_alb_zone_id=$(echo "$info" | cut -f2)" >> "$GITHUB_ENV"
          done
          if [ "$found" = 0 ]; then
            echo "no ALB exists yet: run app-deploy first" >&2
            exit 1
          fi

      - name: Init
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          terraform init \
            -backend-config="bucket=loria-retail-tfstate-${account_id}-${TF_VAR_aws_region}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${TF_VAR_aws_region}"

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -lock-timeout=5m -no-color -out=tfplan
          code=$?
          set -e
          # 0 = no changes, 2 = changes, anything else is an error.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Plan summary
        if: always()
        env:
          ACTION: ${{ inputs.action }}
        run: |
          {
            echo "### terraform ${ACTION}: dev/alb-dns"
            echo '```'
            terraform show -no-color tfplan 2>&1 | head -c 100000 || echo "no plan was produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The plan can hold sensitive values, so it goes to the private state
      # bucket (dev/*), not to a workflow artifact on a public repo.
      - name: Save the plan
        id: save
        if: steps.plan.outputs.has_changes == 'true' && inputs.action != 'plan'
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          key="dev/plans/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tfplan"
          aws s3 cp tfplan "s3://loria-retail-tfstate-${account_id}-${TF_VAR_aws_region}/${key}"
          echo "plan_key=${key}" >> "$GITHUB_OUTPUT"
          echo "plan_sha256=$(sha256sum tfplan | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Diagnostics on failure
        if: failure()
        run: terraform state list || true

  apply:
    needs: plan
    if: inputs.action != 'plan' && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 90
    env:
      PLAN_KEY: ${{ needs.plan.outputs.plan_key }}
      PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_TF }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          terraform init \
            -backend-config="bucket=loria-retail-tfstate-${account_id}-${TF_VAR_aws_region}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${TF_VAR_aws_region}"

      - name: Fetch the approved plan
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          aws s3 cp "s3://loria-retail-tfstate-${account_id}-${TF_VAR_aws_region}/${PLAN_KEY}" tfplan
          echo "${PLAN_SHA256}  tfplan" | sha256sum --check

      # A saved plan is refused if the state changed since it was made.
      - name: Apply
        run: terraform apply -lock-timeout=5m -no-color tfplan

      - name: Outputs
        run: |
          {
            echo "### Outputs"
            echo '```json'
            terraform output -json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the saved plan
        if: always()
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          aws s3 rm "s3://loria-retail-tfstate-${account_id}-${TF_VAR_aws_region}/${PLAN_KEY}" || true

      - name: Diagnostics on failure
        if: failure()
        run: |
          terraform show -no-color tfplan || true
          terraform state list || true
