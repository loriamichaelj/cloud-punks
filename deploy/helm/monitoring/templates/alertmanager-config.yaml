apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  labels: {{- include "monitoring.labels" (dict "root" . "name" "alertmanager") | nindent 4 }}
data:
  alertmanager.yml: |
    route:
      receiver: {{ if .Values.alertmanager.snsTopicArn }}sns{{ else }}nobody{{ end }}
      group_by: [alertname, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: nobody
{{- if .Values.alertmanager.snsTopicArn }}
      # The default subject and message templates. The credentials are the pod's own (EKS Pod Identity).
      - name: sns
        sns_configs:
          - topic_arn: {{ .Values.alertmanager.snsTopicArn | quote }}
            sigv4:
              region: {{ .Values.alertmanager.region | quote }}
            send_resolved: true
{{- end }}
