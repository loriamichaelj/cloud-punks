image:
  repository: loria-retail/product   # the registry is added by app-deploy
args: [api]
port: 8001
service: { enabled: true, port: 8001 }
pdb: { enabled: true }
hpa: { enabled: true }
env:
  SERVICE_NAME: product-service
  DB_HOST: loria-retail-dev.cefo7yhuwfxg.us-east-1.rds.amazonaws.com
  DB_NAME: product_db
  DB_USER: product_app
secretEnv:
  - { name: DB_PASSWORD, secret: product-app-db, key: DB_PASSWORD }
migrate:
  enabled: true
  env:
    ENVIRONMENT: dev
    LOG_LEVEL: INFO
    SERVICE_NAME: product-migrate
    DB_HOST: loria-retail-dev.cefo7yhuwfxg.us-east-1.rds.amazonaws.com
    DB_PORT: "5432"
    DB_NAME: product_db
    DB_USER: product_owner
    DB_SSLMODE: require
  secretEnv:
    - { name: DB_PASSWORD, secret: product-owner-db, key: DB_PASSWORD }
