# Static file server for the built SPA (DESIGN.md section 15.5). Runs as a non-root user and writes
# only under /tmp, so the root filesystem can be read-only (mount an emptyDir on /tmp in Kubernetes).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8005;
    root /usr/share/nginx/html;

    # Liveness and readiness are the same: it is static files, nothing external to check.
    location = /healthz {
      include /etc/nginx/security-headers.conf;
      default_type text/plain;
      add_header Cache-Control "no-store" always;
      return 200 "ok\n";
    }

    # Hashed assets never change under the same name.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Extension-less paths are client-side routes: serve the app shell. A path with a file
    # extension that does not exist is a real 404.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri @shell;
    }

    location @shell {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      if ($uri ~ "\.[A-Za-z0-9]+$") {
        return 404;
      }
      rewrite ^ /index.html break;
    }
  }
}
